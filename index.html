<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="cabecalho">
            <img src="logo.jpeg" width="120">
            <h1>Sistema Escolar</h1>
 </div>
 
        <div class="formulario">
            <input type="text" id="nome" placeholder="Nome do aluno">
            <input type="number" id="nota" placeholder="Nota (0 a 10)" min="0" max="10" step="0.1">
            <input type="numer" id="frequencia" placeholder="Frequência (0 a 100)" min="0" max="100"> 

            <button onclick="cadastrarAluno()">
                Cadastrar
            </button>
        </div>

        <h2>Cadastro de Notas</h2>
        <div class="tabela-box">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nota</th>
                    <th>Frequência</th>
                    <th>Situação</th>
                </tr>
            </thead>

            <tbody id="listaAlunos">
            </tbody>
        </table>
</div>
        <button onclick="calcularResultados()">
            Ver Resultados
        </button>

        <p id="resultado"></p>


    </div>

    <script src="script.js"></script>

</body>
</html>
